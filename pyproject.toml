[project]
name = "ddb_single"
version = "0.6.1"
description = "Python DynamoDB interface, specialized in single-table design."
authors = [{ name = "medaka0213" }]
license = "MIT"
readme = "readme.md"
requires-python = ">=3.10"
keywords = ["aws", "dynamodb", "serverless"]
dependencies = [
    "boto3>=1.34.79",
    "click>=8.1",
]

[project.urls]
Homepage = "https://medaka0213.github.io/DynamoDB-SingleTable/"
Repository = "https://github.com/medaka0213/DynamoDB-SingleTable"

[project.scripts]
ddb_single = "ddb_single._cli:cli"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "pytest-cov>=5,<8",
    "sphinx>=7.2.6",
    "sphinx-rtd-theme>=2,<4",
    "myst-parser>=2,<5",
]
e2e = [
    "pytest>=8.0",
    "pytest-playwright>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ddb_single"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "C90", "I"]
# E402: module-level import not at top of file
# E501: line too long (the formatter handles wrapping)
# E731: lambda assignment
ignore = ["E402", "E501", "E731"]

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.pytest.ini_options]
testpaths = ["tests"]
