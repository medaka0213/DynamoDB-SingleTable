name: Release
on:
  workflow_dispatch:
    inputs:
      rule:
        description: "Version bump rule (uv version --bump)"
        required: false
        default: patch
        type: choice
        options:
          - major
          - minor
          - patch
          - stable
          - alpha
          - beta
          - rc

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      # Read tags for the changelog and create the GitHub Release (built-in GITHUB_TOKEN)
      contents: write
      # PyPI Trusted Publishing (OIDC)
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Do not persist credentials; the tag push authenticates explicitly with GH_TOKEN
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - name: Get changelog
        id: tag_version
        uses: mathieudutour/github-tag-action@a22cf08638b34d5badda920f9daf6e72c477b07b # v6.2
        with:
          # Dry run only computes the changelog; the built-in token is sufficient
          github_token: ${{ secrets.GITHUB_TOKEN }}
          dry_run: true

      - name: Update version
        env:
          BUMP_RULE: ${{ github.event.inputs.rule }}
        run: |
          uv version --bump "$BUMP_RULE"
          version=$(uv version --short)
          echo "VERSION=$version" >> $GITHUB_ENV

      - name: Build and publish package
        run: |
          uv build
          uv publish --trusted-publishing always

      - name: Set up git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: "[skip ci] Bump version to ${{ env.VERSION }}"
          delete-branch: true
          title: Bump version to ${{ env.VERSION }}
          branch: release/${{ env.VERSION }}
          body: |
            Bump version to ${{ env.VERSION }}
            ${{ steps.tag_version.outputs.changelog }}
          token: ${{ secrets.GH_TOKEN }}

      - name: Create and push tag
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git tag "v${VERSION}"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "v${VERSION}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: v${{ env.VERSION }}
          name: Release v${{ env.VERSION }}
          draft: false
          prerelease: false
          body: ${{ steps.tag_version.outputs.changelog }}
          # Release creation only needs contents: write; use the built-in token
          token: ${{ secrets.GITHUB_TOKEN }}
