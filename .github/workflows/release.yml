name: Release
on:
  workflow_dispatch:
    inputs:
      rule:
        description: "Version bump rule (uv version --bump)"
        required: false
        default: patch
        type: choice
        options:
          - major
          - minor
          - patch
          - stable
          - alpha
          - beta
          - rc

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Get changelog
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GH_TOKEN }}
          dry_run: true

      - name: Update version
        env:
          BUMP_RULE: ${{ github.event.inputs.rule }}
        run: |
          uv version --bump "$BUMP_RULE"
          version=$(uv version --short)
          echo "VERSION=$version" >> $GITHUB_ENV

      - name: Build and publish package
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          uv build
          uv publish

      - name: Set up git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "[skip ci] Bump version to ${{ env.VERSION }}"
          delete-branch: true
          title: Bump version to ${{ env.VERSION }}
          branch: release/${{ env.VERSION }}
          body: |
            Bump version to ${{ env.VERSION }}
            ${{ steps.tag_version.outputs.changelog }}
          token: ${{ secrets.GH_TOKEN }}

      - name: Create and push tag
        run: |
          git tag v${{ env.VERSION }}
          git push origin v${{ env.VERSION }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION }}
          name: Release v${{ env.VERSION }}
          draft: false
          prerelease: false
          body: ${{ steps.tag_version.outputs.changelog }}
          token: ${{ secrets.GH_TOKEN }}
