# lint_and_test.yml
name: Lint and Test

on:
  push:

jobs:
  lint_and_test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      dynamodb:
        image: amazon/dynamodb-local:2.6.0
        ports:
          - 8000:8000
        options: --name dynamodb

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run ruff linter
        run: uv run ruff check .

      - name: Run ruff formatter check
        run: uv run ruff format --check .

      - name: Run unittest
        run: uv run pytest --cov=ddb_single -v

      - name: Test Build
        run: uv build

      - name: Generate docs
        run: |
          cp ./readme.md ./docs_src/readme.md
          uv run sphinx-apidoc -f -o ./docs_src ./ddb_single
          uv run sphinx-build ./docs_src ./docs

      - name: Upload static files as artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./docs

  e2e_test:
    # 単体テスト通過後に example/ のサンプルアプリを起動し、Playwright で E2E テストする
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install e2e dependencies
        run: uv sync --frozen --group e2e

      - name: Install Playwright browser
        run: uv run playwright install --with-deps chromium

      - name: Start example blog app
        run: docker compose -f example/docker-compose.yml up -d --build --wait --wait-timeout 180

      - name: Run e2e tests
        env:
          E2E_BASE_URL: http://localhost:8080
        run: uv run pytest example/e2e -v

      - name: Show app logs on failure
        if: failure()
        run: docker compose -f example/docker-compose.yml logs

      - name: Stop example blog app
        if: always()
        run: docker compose -f example/docker-compose.yml down

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [lint_and_test, e2e_test]
    permissions:
      contents: read
      id-token: write
      pages: write
    if: github.ref == 'refs/heads/master'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
